<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Drone App</title>
  </head>
  <body>
    <div id="app">
      <div id="top-bar">
        <h1>Drone Fleet</h1>
        <div id="top-bar-summary"></div>
      </div>
      <div id="map"></div>
      <div id="side-bar">
        <h1>Fleet</h1>
        <div id="filter-group">
          <button type="button" class="filter-btn-active" data-class="all">All</button>
          <button type="button" class="filter-btn" data-class="light">Light</button>
          <button type="button" class="filter-btn" data-class="medium">Medium</button>
          <button type="button" class="filter-btn" data-class="heavy">Heavy</button>
        </div>
        <ul id="fleet-list"></ul>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
